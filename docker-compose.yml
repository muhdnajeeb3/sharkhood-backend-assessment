services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      RAW_DB: provider_raw
      DOMAIN_DB: provider_domain
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BATCH_SIZE: 25
      WORKER_CONCURRENCY: 4
      JOB_ATTEMPTS: 5
      JOB_BACKOFF_MS: 1000
      PROVIDER: xbyte

volumes:
  mongo_data:
